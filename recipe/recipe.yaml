schema_version: 1

context:
  version: 1.7.4

package:
  name: geotiff
  version: ${{ version }}

source:
  url: http://download.osgeo.org/geotiff/libgeotiff/libgeotiff-${{ version }}.tar.gz
  sha256: c598d04fdf2ba25c4352844dafa81dde3f7fd968daa7ad131228cd91e9d3dc47

build:
  number: 6

requirements:
  build:
    - cmake
    - if: unix
      then: make
    - if: unix
      then: gnuconfig
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
  host:
    - proj
    - zlib
    - libjpeg-turbo
    - libtiff
  run:
    - proj
    - zlib
    - libjpeg-turbo
    - libtiff
  run_exports:
    - ${{ pin_subpackage('geotiff', upper_bound='x.x') }}

tests:
  - files:
      recipe:
        - CMakeLists.txt
        - test_geotiff.c
    requirements:
      run:
        - if: target_platform == "win-arm64"
          then:
            - cmake
            - ${{ compiler('c') }}
    script:
      - listgeo -st_test
      - if: not win
        then: test -f $PREFIX/lib/libgeotiff${SHLIB_EXT}
        else:
          - if not exist %LIBRARY_INC%\\geotiff.h exit 1
          - if not exist %LIBRARY_LIB%\\geotiff_i.lib exit 1
          - if not exist %LIBRARY_BIN%\\geotiff.dll exit 1
          - if not exist %LIBRARY_BIN%\\listgeo.exe exit 1
      - if: target_platform == "win-arm64"
        then:
          - cmake -S . -B test-build -G "NMake Makefiles" -DCMAKE_PREFIX_PATH="%LIBRARY_PREFIX%"
          - if errorlevel 1 exit 1
          - cmake --build test-build
          - if errorlevel 1 exit 1
          - set "PATH=%LIBRARY_BIN%;%PATH%"
          - test-build\\geotiff_consumer.exe
          - if errorlevel 1 exit 1
          - dumpbin /headers test-build\\geotiff_consumer.exe | findstr /I /C:"AA64 machine (ARM64)"
          - if errorlevel 1 exit 1
          - dumpbin /headers "%LIBRARY_BIN%\\listgeo.exe" | findstr /I /C:"AA64 machine (ARM64)"
          - if errorlevel 1 exit 1
          - dumpbin /headers "%LIBRARY_BIN%\\geotiff.dll" | findstr /I /C:"AA64 machine (ARM64)"
          - if errorlevel 1 exit 1
about:
  license: MIT
  license_file: LICENSE
  summary: TIFF based interchange format for georeferenced raster imagery
  description: |
    GeoTIFF represents an effort by over 160 different remote sensing,
    GIS, cartographic, and surveying related companies and organizations
    to establish a TIFF based interchange format for georeferenced raster imagery.


  homepage: https://trac.osgeo.org/geotiff

extra:
  recipe-maintainers:
    - akrherz
    - gillins
    - ocefpaf
    - xylar
    - hobu
